name: plagx_preflight
description: >-
  Free draft checker for essays and papers: word count, citation and reference list checks,
  punctuation and basic grammar suggestions, readability stats. Runs offline. By Plagiarism Checker X.
version: 0.1.2
homepage: https://plagiarismcheckerx.github.io/plagx-preflight/
repository: https://github.com/plagiarismcheckerx/plagx-preflight-dart
issue_tracker: https://github.com/plagiarismcheckerx/plagx-preflight-dart/issues
topics:
  - grammar
  - writing
  - text
  - education
  - academic

environment:
  sdk: ^3.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

executables:
  plagx-preflight: plagx_preflight
